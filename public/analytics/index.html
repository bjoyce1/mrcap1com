<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mr. CAP Analytics Dashboard</title>
  <link rel="stylesheet" href="/analytics/styles.css" />
  <meta name="robots" content="noindex,nofollow" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Dashboard navigation">
      <div class="brand">
        <div class="brand-mark">MC</div>
        <div>
          <strong>Mr. CAP</strong>
          <span>InsightFlow</span>
        </div>
      </div>

      <nav class="nav-list" id="primary-nav">
        <button class="nav-item active" data-view="overview"     type="button"><span>⌂</span>Overview</button>
        <button class="nav-item"        data-view="realtime"     type="button"><span>↯</span>Real-Time</button>
        <button class="nav-item"        data-view="audience"     type="button"><span>◎</span>Audience</button>
        <button class="nav-item"        data-view="acquisition"  type="button"><span>◌</span>Acquisition</button>
        <button class="nav-item"        data-view="behavior"     type="button"><span>▣</span>Behavior</button>
        <button class="nav-item"        data-view="conversions"  type="button"><span>⚑</span>Conversions</button>
        <button class="nav-item"        data-view="music"        type="button"><span>♬</span>Music</button>
        <button class="nav-item"        data-view="campaigns"    type="button"><span>◈</span>Campaigns</button>
        <button class="nav-item"        data-view="events"       type="button"><span>✦</span>Events</button>
        <button class="nav-item"        data-view="reports"      type="button"><span>□</span>Reports</button>
        <button class="nav-item"        data-view="explore"      type="button"><span>⌕</span>Explore</button>
      </nav>

      <div class="sidebar-divider"></div>

      <nav class="nav-list lower" id="secondary-nav">
        <button class="nav-item" data-view="alerts"      type="button"><span>!</span>Alerts</button>
        <button class="nav-item" data-view="annotations" type="button"><span>✎</span>Annotations</button>
        <button class="nav-item" data-view="dataquality" type="button"><span>盾</span>Data Quality</button>
      </nav>

      <div class="sidebar-footer">
        <button class="nav-item" id="token-btn" type="button"><span>⚿</span>Set Token</button>
        <button class="nav-item" id="export-btn" type="button"><span>↓</span>Export JSON</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="title-group">
          <p class="eyebrow" id="view-eyebrow">Website traffic command center</p>
          <h1 id="view-title">Overview</h1>
        </div>
        <div class="topbar-actions">
          <label class="select-label">
            <span>Date Range</span>
            <select id="days-select" aria-label="Date range">
              <option value="7">Last 7 days</option>
              <option value="30" selected>Last 30 days</option>
              <option value="60">Last 60 days</option>
              <option value="90">Last 90 days</option>
            </select>
          </label>
          <button class="ghost-btn" id="refresh-btn" type="button">Refresh</button>
          <label class="search-box" aria-label="Search dashboard">
            <span>⌕</span>
            <input id="search-input" type="search" placeholder="Search reports, metrics, pages..." />
          </label>
          <div class="avatar" title="Mr. CAP analytics">MC</div>
        </div>
      </header>

      <section class="status-strip" id="status-strip">
        <div>
          <strong id="status-title">Loading analytics…</strong>
          <span id="status-copy">Connecting to the summary API.</span>
        </div>
        <code id="status-endpoint">analytics-summary</code>
      </section>

      <!-- View container - rendered by app.js -->
      <section id="view-root"></section>
    </main>
  </div>

  <script src="/analytics/app.js" defer></script>
</body>
</html>
